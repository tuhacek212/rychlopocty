<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KK Slaný – Krasobruslařský klub královského města Slaného</title>
  <meta name="description" content="Krasobruslařský klub královského města Slaného – rozpis tréninků, nábor, fotogalerie a kontakty.">
  <meta name="theme-color" content="#12355b">
  <link rel="stylesheet" href="css/styl.css">
</head>
<body>
  <header class="hlavicka">
    <div class="hlavicka__in">
      <a class="logo" href="index.html">
        <span class="logo__znak" aria-hidden="true">⛸️</span>
        <span class="logo__text"><strong>KK Slaný</strong><span>Krasobruslařský klub</span></span>
      </a>
      <nav class="nav-horni" aria-label="Hlavní menu">
        <a href="index.html" aria-current="page">Úvod</a>
        <a href="rozpis.html">Rozpis tréninků</a>
        <a href="galerie.html">Fotogalerie</a>
        <a href="index.html#kontakt">Kontakt</a>
      </nav>
    </div>
  </header>

  <main>
    <noscript><p class="hlaska">Pro zobrazení rozpisu je potřeba zapnout JavaScript.</p></noscript>

    <section aria-labelledby="nadpis-nejblizsi">
      <h1 id="nadpis-nejblizsi" class="skryte">Nejbližší trénink</h1>
      <div id="nejblizsi"></div>
    </section>

    <section class="sekce" aria-labelledby="nadpis-tyden">
      <div class="sekce__hlava">
        <h2 id="nadpis-tyden">Tento týden</h2>
        <a href="rozpis.html">Celý rozpis →</a>
      </div>
      <div id="tyden"></div>
    </section>

    <div class="mrizka mrizka--2 sekce">
      <section class="karta" aria-labelledby="nadpis-kalendar">
        <h2 id="nadpis-kalendar">Tréninky v mobilu</h2>
        <p>Přidejte si rozpis do kalendáře v telefonu. Změny se v něm objeví samy.</p>
        <div id="kalendar"></div>
      </section>
      <section class="karta" aria-labelledby="nadpis-nabor">
        <h2 id="nadpis-nabor">Nábor nových členů</h2>
        <p id="nabor"></p>
        <div class="tlacitka"><a class="tlacitko" id="nabor-telefon" href="#">Zavolat</a></div>
      </section>
    </div>

    <section class="sekce karta" id="kontakt" aria-labelledby="nadpis-kontakt">
      <h2 id="nadpis-kontakt">Kontakt</h2>
      <div id="kontakt-obsah"></div>
    </section>
  </main>

  <footer class="paticka" id="paticka"></footer>

  <nav class="nav-spodni" aria-label="Menu">
    <a href="index.html" aria-current="page"><svg class="svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/></svg>Úvod</a>
    <a href="rozpis.html"><svg class="svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Rozpis</a>
    <a href="galerie.html"><svg class="svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-8 8"/></svg>Fotky</a>
    <a href="index.html#kontakt"><svg class="svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>Kontakt</a>
  </nav>

  <script src="data/data.js"></script>
  <script src="js/spolecne.js"></script>
  <script src="js/uvod.js"></script>
