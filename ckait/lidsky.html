<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Otázky ČKAIT TZS v úředním i lidském znění – procvičování, témata a tahák.">
<title>TZS lidsky</title>
<style>html{color-scheme:light dark}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Stejný jazyk jako trenažér: bílá/černá, vlasové linky, DM Mono popisky, Archivo text. */
:root{
  --bg:#FFFFFF; --bg-2:#F7F7F8;
  --ink:#0A0A0B; --ink-2:#5E6166; --ink-3:#9A9DA3;
  --line:#E4E5E8; --line-2:#C9CBD0;
  --accent:#1433FF;
  --ok:#066E4A; --ok-bg:#E9F5F0;
  --bad:#C62A1E; --bad-bg:#FCECEA;
  --inv-bg:#0A0A0B; --inv-ink:#FFFFFF;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08090A; --bg-2:#121315; --ink:#F5F6F7; --ink-2:#9CA0A6; --ink-3:#63676D;
  --line:#1F2124; --line-2:#33363B; --accent:#8CA0FF;
  --ok:#4FC38D; --ok-bg:#0E2119; --bad:#FF7A6B; --bad-bg:#24120F; --inv-bg:#F5F6F7; --inv-ink:#08090A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08090A; --bg-2:#121315; --ink:#F5F6F7; --ink-2:#9CA0A6; --ink-3:#63676D;
  --line:#1F2124; --line-2:#33363B; --accent:#8CA0FF;
  --ok:#4FC38D; --ok-bg:#0E2119; --bad:#FF7A6B; --bad-bg:#24120F; --inv-bg:#F5F6F7; --inv-ink:#08090A; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Archivo,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.mono,.lab,.meta,.keys,.src,.chip,.tbtn,.modes button,.act,.vt button,summary{font-family:"DM Mono",ui-monospace,monospace}
.lab{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin:0}
.wrap{max-width:52rem;margin:0 auto;padding-inline:20px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:16px;padding-block:14px}
.logo{font-family:"DM Mono",monospace;font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid transparent;padding-bottom:1px;text-decoration:none;white-space:nowrap}
.tbtn:hover{color:var(--ink);border-bottom-color:var(--ink)}
.modes{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none}
.modes button{flex:none;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);padding:4px 0 10px;border-bottom:2px solid transparent}
.modes button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.filters{display:flex;gap:16px;overflow-x:auto;padding-block:10px 12px;scrollbar-width:none;border-top:1px solid var(--line)}
.chip{flex:none;font-size:.7rem;letter-spacing:.06em;color:var(--ink-3);border-bottom:1px solid transparent;padding-bottom:1px;white-space:nowrap}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.bar{height:2px}
.bar>i{display:block;height:100%;background:var(--ink);width:0;transition:width .3s cubic-bezier(.4,0,.2,1)}

main{padding-block:clamp(28px,6vw,48px) 96px;display:flex;flex-direction:column;gap:22px}
.meta{display:flex;gap:10px 14px;flex-wrap:wrap;align-items:baseline;justify-content:space-between;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.meta .okn{text-transform:none;letter-spacing:.02em}
.vt{display:inline-flex;gap:12px}
.vt button{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid transparent;padding-bottom:1px}
.vt button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.q{font-weight:600;font-size:clamp(1.24rem,3.2vw,1.5rem);line-height:1.28;letter-spacing:-.022em;margin:0;text-wrap:pretty;max-width:44ch}
.answers{border-top:1px solid var(--line)}
.ans{display:grid;grid-template-columns:2.2rem 1fr;gap:4px;width:100%;text-align:left;padding:19px 4px;border-bottom:1px solid var(--line);font-size:1.04rem;line-height:1.5;transition:background .1s ease,padding-left .12s ease}
.ans:hover:not(:disabled){background:var(--bg-2);padding-left:10px}
.ans:disabled{cursor:default}
.ans .n{font-family:"DM Mono",monospace;font-size:.8rem;color:var(--ink-3);padding-top:2px}
.ans.ok{background:var(--ok-bg)} .ans.ok .n{color:var(--ok)}
.ans.bad{background:var(--bad-bg)} .ans.bad .n{color:var(--bad)}
.ans.dim{color:var(--ink-3)}
.ans small{display:block;font-family:"DM Mono",monospace;font-size:.72rem;color:var(--ink-3);margin-top:6px;line-height:1.5}
.fb{display:flex;flex-direction:column;gap:12px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.verdict{font-family:"DM Mono",monospace;font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;font-weight:500}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.common{margin:0;display:flex;flex-direction:column;gap:6px;max-width:62ch}
.common .lab{font-size:.62rem}
.common span:last-child{color:var(--ink-2)}
.why{margin:0;max-width:62ch}
.hook{margin:0;font-family:"DM Mono",monospace;font-size:.8rem;line-height:1.5;color:var(--ink-2);padding-left:10px;border-left:2px solid var(--ink)}
.hook span{background:none;color:inherit;padding:0}
details{border-top:1px solid var(--line);padding-top:10px}
summary{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);cursor:pointer}
.orig{margin:.6em 0 0;font-size:.95rem;color:var(--ink-2)}
.src{font-size:.78rem;line-height:1.55;color:var(--ink-2);overflow-wrap:anywhere}
.row{display:flex;gap:24px;flex-wrap:wrap}
.btn,.act{font-family:"DM Mono",monospace;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;padding:14px 0;color:var(--ink);border-bottom:1px solid var(--line-2);min-height:44px}
.btn:hover{border-bottom-color:var(--ink)}
.btn.ghost{color:var(--ink-2)}
.keys{font-size:.68rem;letter-spacing:.14em;color:var(--ink-3);margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.st{padding:14px 0}
.st+.st{border-left:1px solid var(--line);padding-left:14px}
.st b{display:block;font-weight:700;font-size:1.6rem;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1.1}
.st span{font-family:"DM Mono",monospace;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.search{width:100%;border:0;border-bottom:1px solid var(--line-2);background:transparent;padding:10px 0;font-size:1rem;border-radius:0}
.search:focus{outline:none;border-bottom-color:var(--ink)}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.it{border-bottom:1px solid var(--line);padding-block:16px;display:flex;flex-direction:column;gap:6px}
.it .k{font-family:"DM Mono",monospace;font-size:.72rem;color:var(--ink-3)}
.it .iq{font-weight:600;font-size:1.04rem;line-height:1.35;letter-spacing:-.015em}
.it .ia{margin:0}
.it .ia mark{background:var(--ok-bg);color:var(--ink);padding:0 .15em}
.it .io{margin:0;font-size:.9rem;color:var(--ink-2)}
.more{align-self:center}
.empty{color:var(--ink-2)}
.banner{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line)}
.banner span{font-weight:600}
.banner button{margin-left:auto;font-family:"DM Mono",monospace;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--line-2)}
.stmt{font-weight:600;font-size:clamp(1.24rem,3.2vw,1.5rem);line-height:1.28;letter-spacing:-.022em;margin:0;padding:18px 0 18px 16px;border-left:3px solid var(--ink);max-width:44ch}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;border-top:1px solid var(--line)}
.tf .ans{grid-template-columns:1fr;font-family:"DM Mono",monospace;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase}
.step{font-family:"DM Mono",monospace;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:0}
.tfres{margin:0}
.tfres.ok{color:var(--ok)} .tfres.bad{color:var(--bad)}
.facts{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px;max-width:62ch}
.facts li{line-height:1.5}
.lnk{color:var(--ink);border-bottom:1px solid var(--line-2);font-family:"DM Mono",monospace;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase}
.topics{display:flex;flex-direction:column}
.tp{padding-block:22px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.tp h2{font-weight:600;font-size:1.2rem;letter-spacing:-.02em;margin:0;line-height:1.25}
.tp .s{margin:0;color:var(--ink-2)}
.tp .pr{display:flex;align-items:center;gap:12px;font-family:"DM Mono",monospace;font-size:.72rem;color:var(--ink-3)}
.tp .pr i{flex:1;max-width:12rem;height:2px;background:var(--line);display:block}
.tp .pr i b{display:block;height:100%;background:var(--ink)}
.tp .row .btn{padding:8px 0}
.okh{font-weight:700;font-size:clamp(1.6rem,6vw,2.4rem);letter-spacing:-.045em;line-height:1;margin:28px 0 4px;padding-bottom:14px;border-bottom:1px solid var(--ink);text-wrap:balance}
.cheat{display:flex;flex-direction:column}
.cheat h3{font-family:"DM Mono",monospace;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;font-weight:500;color:var(--ink-3);margin:22px 0 6px}
.ch{display:grid;grid-template-columns:3.2rem 1fr;gap:10px;align-items:baseline;padding-block:7px;border-bottom:1px solid var(--line);line-height:1.45}
.ch .k{font-family:"DM Mono",monospace;font-size:.72rem;color:var(--ink-3)}
.opt{display:flex;gap:8px;align-items:center;font-family:"DM Mono",monospace;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);cursor:pointer}
.opt input{accent-color:var(--ink);margin:0}
@media (max-width:560px){.wrap{padding-inline:16px}.hd{gap:12px}.ans{padding:17px 2px;grid-template-columns:1.9rem 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<header>
  <div class="wrap">
    <div class="hd">
      <div class="logo">TZS — po tématech</div>
      <a class="tbtn" href="./">Test →</a>
      <button class="tbtn" id="theme" aria-label="Přepnout světlý a tmavý režim">Tmavě</button>
    </div>
    <nav class="modes" aria-label="Režim">
      <button data-m="learn" aria-pressed="true">Procvičit</button>
      <button data-m="topics" aria-pressed="false">Témata</button>
      <button data-m="cheat" aria-pressed="false">Tahák</button>
      <button data-m="browse" aria-pressed="false">Projít vše</button>
    </nav>
    <div class="filters" id="filters" aria-label="Okruhy"></div>
  </div>
  <div class="bar" aria-hidden="true"><i id="bar"></i></div>
</header>

<div class="wrap"><main id="main"></main></div>
<script src="lidsky-data.js"></script>
<script>
const DATA=window.TZS_LIDSKY;
const root=document.documentElement;
function applyTheme(t){ if(t) root.setAttribute("data-theme",t); else root.removeAttribute("data-theme");
  const dark=t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches; document.querySelector("#theme").textContent=dark?"Světle":"Tmavě"; }
let th=null; try{th=localStorage.getItem("tzs-theme")}catch(e){} applyTheme(th);
document.querySelector("#theme").onclick=()=>{const dark=root.getAttribute("data-theme")==="dark"||(!root.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme: dark)").matches);
  const n=dark?"light":"dark"; applyTheme(n); try{localStorage.setItem("tzs-theme",n)}catch(e){}};
const Q=DATA.q, OK=DATA.okruhy, T=DATA.temata;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const byK={};Q.forEach(q=>byK[q.k]=q);
let store={};
try{store=JSON.parse(localStorage.getItem('tzs-lidsky')||'{}')}catch(e){}
const S=Object.assign({voice:'l',mode:'learn',okruh:'*',tema:null,tf:true,hist:{}},store);
try{const lv=localStorage.getItem('tzs-lid'); if(lv!==null) S.voice=lv==='1'?'l':'u'}catch(e){}
if(location.hash==='#opakovat'){S.okruh='!';S.mode='learn';S.tema=null}
const vt=()=>`<span class="vt"><button data-voice="u" aria-pressed="${S.voice!=='l'}">Úředně</button><button data-voice="l" aria-pressed="${S.voice==='l'}">Lidsky</button></span>`;
function setVoice(v){S.voice=v;try{localStorage.setItem('tzs-lid',v==='l'?'1':'0')}catch(e){}save();render()}
function save(){try{const cur=JSON.parse(localStorage.getItem('tzs-lidsky')||'{}');const h=Object.assign({},cur.hist||{},S.hist);S.hist=h;localStorage.setItem('tzs-lidsky',JSON.stringify({voice:S.voice,okruh:S.okruh,tema:S.tema,tf:S.tf,mode:S.mode,hist:h}))}catch(e){}}

const isBad=k=>S.hist[k]&&S.hist[k].last===0;
const isOk=k=>S.hist[k]&&S.hist[k].last===1;
function pool(){
  if(S.tema!==null&&S.mode==='learn') return T[S.tema].k.map(k=>byK[k]);
  return Q.filter(q=>S.okruh==='*'||(S.okruh==='!'?isBad(q.k):q.o===S.okruh));
}
function okName(k){return OK[k].split(',')[0].replace(/\s*\(.*$/,'')}

function renderFilters(){
  const wrong=Q.filter(q=>isBad(q.k)).length;
  const items=[['*','Vše · '+Q.length],['!','K opakování · '+wrong],...Object.keys(OK).map(k=>[k,k+' · '+okName(k)])];
  $('#filters').innerHTML=items.map(([k,t])=>`<button class="chip" data-k="${k}" aria-pressed="${S.okruh===k}" title="${esc(OK[k]||'')}">${esc(t)}</button>`).join('');
}
$('#filters').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;S.okruh=b.dataset.k;S.tema=null;save();cur=null;render()});
function updateBar(){
  const p=pool(); const done=p.filter(q=>isOk(q.k)).length;
  $('#bar').style.width=(p.length?done/p.length*100:0)+'%';
}

/* ---------- procvičování ---------- */
let cur=null, order=null, answered=null, tfShow=null, tfAns=null;
function pick(){
  const p=pool(); if(!p.length) return null;
  const w=p.map(q=>{const h=S.hist[q.k];return !h?3:(h.last===0?5:1)});
  let r=Math.random()*w.reduce((a,b)=>a+b,0);
  for(let i=0;i<p.length;i++){r-=w[i];if(r<=0){ if(cur&&p[i].k===cur.k&&p.length>1) continue; return p[i]}}
  return p[p.length-1];
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const useTF=q=>S.tf&&q.tp;

function renderLearn(){
  if(!cur){cur=pick();order=shuffle([0,1,2]);answered=null;tfAns=null;tfShow=cur&&Math.random()<.5?'p':'n'}
  const m=$('#main');
  let html='';
  if(S.tema!==null){const t=T[S.tema];html+=`<div class="banner"><span>Téma: <b>${esc(t.n)}</b> · ${t.k.length} otázek</span><button id="untema">Zpět na celý okruh</button></div>`}
  if(!cur){m.innerHTML=html+`<p class="empty">${S.okruh==='!'?'Žádná otázka teď nečeká na opakování. Dobrá práce.':'Tady zatím nic není.'}</p>`;return}
  const L=S.voice==='l', q=cur, h=S.hist[q.k], t=T[q.tm];
  html+=`<div class="meta"><span>${q.k} · <span class="okn">${esc(okName(q.o))} · ${esc(t.n)}</span>${h?` · ${h.ok+h.bad}× (${h.ok} dobře)`:''}</span>${vt()}</div>`;
  const tf=useTF(q);
  if(tf){
    const st=tfShow==='p'?q.tp:q.tn;
    html+=`<p class="step">Pravda, nebo ne?</p><p class="stmt">${esc(st)}</p>`;
    if(tfAns===null){
      html+=`<div class="tf"><button class="ans" data-tf="p"><span>1 · Pravda</span></button><button class="ans" data-tf="n"><span>2 · Nepravda</span></button></div><p class="keys">Klávesy 1 / 2</p>`;
      m.innerHTML=html+statsHtml()+optHtml();return;
    }
    const tfOk=tfAns===tfShow;
    html+=`<p class="tfres ${tfOk?'ok':'bad'}">${tfOk?'Ano, správně.':'Kdepak.'} Tvrzení je ${tfShow==='p'?'pravdivé':'nepravdivé'}.${tfShow==='n'?' Pravdivě zní: <b>'+esc(q.tp)+'</b>':''}</p>
    <p class="step">${tfShow==='n'?'Teď to oprav: která odpověď na původní otázku platí?':'Teď přesně: která odpověď na původní otázku platí?'}</p>`;
  }
  html+=`<h1 class="q">${esc(L?q.ql:q.q)}</h1>${L&&q.sc?`<p class="common"><span class="lab">Společné pro všechny odpovědi</span><span>${esc(q.sc)}</span></p>`:''}<div class="answers">`;
  const at=L?(q.ad||q.al):q.a;
  order.forEach((i,pos)=>{
    let cls='';
    if(answered!==null){cls=i===0?'ok':(i===answered?'bad':'dim')}
    html+=`<button class="ans ${cls}" data-i="${i}" ${answered!==null?'disabled':''}><span class="n">${pos+1}</span><span>${esc(at[i])}${answered!==null&&L?`<small>${esc(q.a[i])}</small>`:''}</span></button>`;
  });
  html+='</div>';
  if(answered!==null){
    const good=answered===0&&(!tf||tfAns===tfShow);
    html+=`<section class="fb" aria-live="polite">
      <div class="verdict ${good?'ok':'bad'}">${good?'Správně.':(answered===0?'Odpověď sedí, ale pravda/nepravda ne.':'Vedle.')}</div>
      <p class="why">${esc(q.p)}</p>
      ${q.h?`<p class="hook">${esc(q.h)}</p>`:''}
      <div class="src">${esc(q.s)}</div>
      <details><summary>Souvislosti: ${esc(t.n)}</summary><ul class="facts" style="margin-top:.6em">${t.b.map(b=>`<li>${esc(b)}</li>`).join('')}</ul>
        ${S.tema===null?`<p style="margin:.6em 0 0"><button class="lnk" data-tema="${q.tm}">Procvičit celé téma (${t.k.length})</button></p>`:''}</details>
      <details ${L?'':'open'}><summary>${L?'Úřední znění':'Lidské znění'}</summary>
        <p class="orig"><em>${esc(L?q.q:q.ql)}</em><br>→ ${esc(L?q.a[0]:q.al[0])}</p></details>
    </section>
    <div class="row"><button class="btn" id="next">Další otázka</button></div>
    <p class="keys">Enter = další</p>`;
  }else html+=`<p class="keys">Klávesy 1–3 vyberou odpověď</p>`;
  m.innerHTML=html+statsHtml()+optHtml();
}
function statsHtml(){
  const seen=Q.filter(x=>S.hist[x.k]).length, okN=Q.filter(x=>isOk(x.k)).length;
  return `<div class="stats"><div class="st"><b>${seen}</b><span>z ${Q.length} viděno</span></div><div class="st"><b>${okN}</b><span>naposled dobře</span></div><div class="st"><b>${seen-okN}</b><span>k opakování</span></div></div>`;
}
function optHtml(){return `<label class="opt"><input type="checkbox" id="tfopt" ${S.tf?'checked':''}> Ano/ne otázky jako pravda/nepravda s opravou</label>`}
function answerTF(v){if(tfAns!==null||!cur)return;tfAns=v;renderLearn()}
function answer(i){
  if(answered!==null||!cur)return;
  if(useTF(cur)&&tfAns===null)return;
  answered=i;
  const good=i===0&&(!useTF(cur)||tfAns===tfShow);
  const h=S.hist[cur.k]||{ok:0,bad:0,last:null};
  if(good){h.ok++;h.last=1}else{h.bad++;h.last=0}
  S.hist[cur.k]=h;save();renderFilters();updateBar();renderLearn();
  const n=$('#next');n&&n.focus({preventScroll:true});
}
function next(){cur=null;render();window.scrollTo({top:0})}

/* ---------- témata ---------- */
function themesFiltered(){
  return T.map((t,i)=>[t,i]).filter(([t])=>S.okruh==='*'||(S.okruh==='!'?t.k.some(isBad):t.o===S.okruh));
}
function renderTopics(){
  const list=themesFiltered(); let html='', last=null;
  if(!list.length){$('#main').innerHTML='<p class="empty">Žádné téma teď nemá otázky k opakování.</p>';return}
  html+=`<p class="fine meta">${list.length} témat. Přečti si body, pak téma procvič. Otázky jsou seskupené podle souvislostí, ne podle pořadí v zadání.</span></p><div class="topics">`;
  for(const [t,i] of list){
    if(t.o!==last){html+=`<h2 class="okh">${t.o} · ${esc(okName(t.o))}</h2>`;last=t.o}
    const okN=t.k.filter(isOk).length, bad=t.k.filter(isBad).length;
    html+=`<article class="tp"><h2>${esc(t.n)}</h2><p class="s">${esc(t.s)}</p>
      <ul class="facts">${t.b.map(b=>`<li>${esc(b)}</li>`).join('')}</ul>
      <div class="pr"><i><b style="width:${okN/t.k.length*100}%"></b></i><span>${okN}/${t.k.length} dobře${bad?` · ${bad} k opakování`:''}</span></div>
      <div class="row"><button class="btn" data-tema="${i}">Procvičit téma</button></div></article>`;
  }
  $('#main').innerHTML=html+'</div>';
}

/* ---------- tahák ---------- */
function renderCheat(){
  const list=themesFiltered(); let html='<p class="fine meta">Všechny pomůcky na jednom místě, seřazené podle témat. Na rychlé opakování před zkouškou.</span></p><div class="cheat">', last=null;
  for(const [t] of list){
    if(t.o!==last){html+=`<h2 class="okh">${t.o} · ${esc(okName(t.o))}</h2>`;last=t.o}
    const items=t.k.map(k=>byK[k]).filter(q=>q.h&&(S.okruh!=='!'||isBad(q.k)));
    if(!items.length)continue;
    html+=`<h3>${esc(t.n)}</h3>`+items.map(q=>`<div class="ch"><span class="k">${q.k}</span><span>${esc(q.h)}</span></div>`).join('');
  }
  $('#main').innerHTML=html+'</div>';
}

/* ---------- procházení ---------- */
let bq='', limit=40;
function renderBrowse(){
  const L=S.voice==='l', t=bq.trim().toLowerCase();
  let p=pool(); if(t) p=p.filter(q=>(q.k+' '+q.q+' '+q.ql+' '+q.a[0]+' '+q.al[0]+' '+q.s+' '+q.h).toLowerCase().includes(t));
  $('#main').innerHTML=`<input class="search" id="bs" type="search" placeholder="Hledat v otázkách, odpovědích, paragrafech…" value="${esc(bq)}" aria-label="Hledat">
  <div class="meta"><span>${p.length} otázek · správná odpověď zvýrazněná</span>${vt()}</div>
  <div class="list">${p.slice(0,limit).map(q=>`<article class="it"><span class="k">${q.k} · ${esc(q.s)}</span>
    <div class="iq">${esc(L?q.ql:q.q)}</div>
    <p class="ia"><mark>${esc(L?q.al[0]:q.a[0])}</mark></p>
    ${q.h?`<p class="io">Pomůcka: ${esc(q.h)}</p>`:''}
    <p class="io">${L?'Úředně: '+esc(q.a[0]):'Lidsky: '+esc(q.al[0])}</p></article>`).join('')}</div>
  ${p.length>limit?`<button class="btn ghost more" id="more">Načíst dalších ${Math.min(40,p.length-limit)}</button>`:''}`;
  const s=$('#bs'); s.addEventListener('input',()=>{bq=s.value;limit=40;renderBrowse();const n=$('#bs');n.focus();n.setSelectionRange(n.value.length,n.value.length)});
  const mo=$('#more'); mo&&mo.addEventListener('click',()=>{limit+=40;renderBrowse()});
}

function render(){
  document.querySelectorAll('.modes button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===S.mode));
  renderFilters();updateBar();
  ({learn:renderLearn,topics:renderTopics,cheat:renderCheat,browse:renderBrowse})[S.mode]();
}
document.querySelector('.modes').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.mode=b.dataset.m;if(S.mode!=='learn')S.tema=null;cur=null;save();render();window.scrollTo({top:0})});

$('#main').addEventListener('click',e=>{
  const vv=e.target.closest('[data-voice]'); if(vv){setVoice(vv.dataset.voice);return}
  const tm=e.target.closest('[data-tema]'); if(tm){S.tema=+tm.dataset.tema;S.mode='learn';cur=null;save();render();window.scrollTo({top:0});return}
  if(e.target.id==='untema'){S.tema=null;cur=null;save();render();return}
  const f=e.target.closest('[data-tf]'); if(f) return answerTF(f.dataset.tf);
  const a=e.target.closest('.ans'); if(a&&!a.disabled&&a.dataset.i!==undefined) return answer(+a.dataset.i);
  if(e.target.id==='next') next();
});
$('#main').addEventListener('change',e=>{if(e.target.id==='tfopt'){S.tf=e.target.checked;save();if(answered===null){tfAns=null;renderLearn()}}});
document.addEventListener('keydown',e=>{
  if(S.mode!=='learn'||e.target.tagName==='INPUT'||!cur)return;
  if(useTF(cur)&&tfAns===null){if(e.key==='1')answerTF('p');else if(e.key==='2')answerTF('n');return}
  if(answered===null&&['1','2','3'].includes(e.key)) answer(order[+e.key-1]);
  else if(answered!==null&&(e.key==='Enter'||e.key===' ')){e.preventDefault();next()}
});
if(S.tema!==null&&!T[S.tema])S.tema=null;
render();

</script>
</body>
</html>
