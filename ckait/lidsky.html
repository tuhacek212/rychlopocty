<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Otázky ČKAIT TZS přeložené z úředničtiny do běžné češtiny – procvičování, témata a tahák.">
<title>TZS lidsky</title>
<style>[hidden]{display:none!important}</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: jedna úzká čtecí kolona; nahoře lišta s přepínačem Lidsky/Úředně, pod ní karta otázky. Zvýrazňovač = akcent. */
:root{
  --bg:#F3F5F7; --card:#FFFFFF; --ink:#16202A; --ink-2:#4D5B68; --ink-3:#8593A0;
  --line:#DCE2E8; --mark:#FFE14D; --mark-ink:#16202A; --accent:#1F5FBF;
  --ok:#0B7A4B; --ok-bg:#E3F4EB; --bad:#B8322A; --bad-bg:#FBE9E7;
  --f-disp:"Bricolage Grotesque",system-ui,sans-serif;
  --f-body:"Literata",Georgia,serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1318; --card:#161D24; --ink:#E7ECF1; --ink-2:#A3B0BC; --ink-3:#6B7884;
  --line:#25303A; --mark:#E8C93A; --mark-ink:#11161B; --accent:#7FB0FF;
  --ok:#53C98F; --ok-bg:#12261C; --bad:#FF8A7E; --bad-bg:#2A1513; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1318; --card:#161D24; --ink:#E7ECF1; --ink-2:#A3B0BC; --ink-3:#6B7884;
  --line:#25303A; --mark:#E8C93A; --mark-ink:#11161B; --accent:#7FB0FF;
  --ok:#53C98F; --ok-bg:#12261C; --bad:#FF8A7E; --bad-bg:#2A1513; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:46rem;margin:0 auto;padding-inline:16px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px}
.brand{font-family:var(--f-disp);font-weight:700;font-size:1.15rem;letter-spacing:-.02em;margin-right:auto}
.brand mark{background:var(--mark);color:var(--mark-ink);padding:0 .2em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--card)}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;font-family:var(--f-disp);font-weight:500;font-size:.92rem;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg.voice button[aria-pressed="true"]{background:var(--mark);color:var(--mark-ink)}
.bar{height:3px;background:var(--line)}
.bar>i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.filters{display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:4px 9px;font-family:var(--f-mono);font-size:.78rem;color:var(--ink-2)}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--card);box-shadow:inset 0 -3px 0 var(--mark)}
main{padding-block:20px 80px;display:flex;flex-direction:column;gap:18px}
.meta{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;font-family:var(--f-mono);font-size:.78rem;color:var(--ink-3)}
.meta b{color:var(--ink);font-weight:500}
.okn{font-family:var(--f-disp);font-size:.9rem;color:var(--ink-2)}
.q{font-family:var(--f-disp);font-weight:700;font-size:clamp(1.35rem,4.5vw,1.75rem);line-height:1.2;letter-spacing:-.02em;margin:0;text-wrap:balance}
.q.uredne{font-family:var(--f-body);font-weight:500;font-size:clamp(1.2rem,4vw,1.45rem);letter-spacing:0}
.answers{display:flex;flex-direction:column;gap:10px}
.ans{display:grid;grid-template-columns:2rem 1fr;gap:6px;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 14px 14px 10px;line-height:1.45}
.ans:hover:not(:disabled){border-color:var(--ink-3)}
.ans .n{font-family:var(--f-mono);font-size:.8rem;color:var(--ink-3);padding-top:3px;text-align:center}
.ans:disabled{cursor:default}
.ans.ok{background:var(--ok-bg);border-color:var(--ok)}
.ans.ok .n{color:var(--ok)}
.ans.bad{background:var(--bad-bg);border-color:var(--bad)}
.ans.bad .n{color:var(--bad)}
.ans.dim{opacity:.55}
.ans small{display:block;font-family:var(--f-mono);font-size:.72rem;color:var(--ink-3);margin-top:6px}
.fb{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.verdict{font-family:var(--f-disp);font-weight:700;font-size:1.05rem}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.why{margin:0}
.hook{margin:0;font-family:var(--f-disp);font-weight:500}
.hook span{background:var(--mark);color:var(--mark-ink);padding:.05em .3em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
details{border-top:1px solid var(--line);padding-top:10px}
summary{font-family:var(--f-mono);font-size:.78rem;color:var(--ink-2);cursor:pointer}
.orig{margin:.6em 0 0;font-size:.95rem;color:var(--ink-2)}
.orig em{font-style:italic}
.src{font-family:var(--f-mono);font-size:.78rem;color:var(--ink-2)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:8px;padding:11px 18px;font-family:var(--f-disp);font-weight:500}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.keys{font-family:var(--f-mono);font-size:.72rem;color:var(--ink-3);margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.st{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.st b{display:block;font-family:var(--f-disp);font-size:1.5rem;font-variant-numeric:tabular-nums}
.st span{font-family:var(--f-mono);font-size:.72rem;color:var(--ink-3)}
/* procházení */
.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:10px 12px}
.list{display:flex;flex-direction:column}
.it{border-bottom:1px solid var(--line);padding-block:14px;display:flex;flex-direction:column;gap:6px}
.it .k{font-family:var(--f-mono);font-size:.75rem;color:var(--ink-3)}
.it .iq{font-family:var(--f-disp);font-weight:500;font-size:1.05rem;line-height:1.3}
.it .ia{margin:0}
.it .ia mark{background:var(--mark);color:var(--mark-ink);padding:0 .15em}
.it .io{margin:0;font-size:.9rem;color:var(--ink-2)}
.more{align-self:center}
.empty{color:var(--ink-2)}

.modes{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.modes button{flex:none;border:0;background:none;padding:6px 2px;margin-right:14px;font-family:var(--f-disp);font-weight:500;color:var(--ink-2);border-bottom:2px solid transparent}
.modes button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--mark)}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--mark);border-radius:8px;padding:10px 12px;font-family:var(--f-disp);font-size:.95rem}
.banner button{margin-left:auto;border:0;background:none;font-family:var(--f-mono);font-size:.75rem;color:var(--ink-2);text-decoration:underline}
.stmt{font-family:var(--f-disp);font-weight:700;font-size:clamp(1.3rem,4.4vw,1.65rem);line-height:1.25;letter-spacing:-.02em;margin:0;padding:18px;background:var(--card);border:1px dashed var(--ink-3);border-radius:10px;text-wrap:balance}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf .ans{grid-template-columns:1fr;text-align:center;font-family:var(--f-disp);font-weight:500}
.step{font-family:var(--f-mono);font-size:.78rem;color:var(--ink-2);margin:0}
.tfres{margin:0;font-family:var(--f-disp)}
.tfres.ok{color:var(--ok)} .tfres.bad{color:var(--bad)}
.facts{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px}
.facts li{line-height:1.45}
.lnk{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;font:inherit}
.topics{display:flex;flex-direction:column;gap:14px}
.tp{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px}
.tp h2{font-family:var(--f-disp);font-weight:700;font-size:1.15rem;letter-spacing:-.01em;margin:0;line-height:1.25}
.tp .s{margin:0;color:var(--ink-2)}
.tp .pr{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:.75rem;color:var(--ink-3)}
.tp .pr i{flex:1;max-width:10rem;height:4px;background:var(--line);border-radius:2px;overflow:hidden;display:block}
.tp .pr i b{display:block;height:100%;background:var(--ok)}
.tp .row .btn{padding:8px 14px;font-size:.92rem}
.okh{font-family:var(--f-disp);font-weight:700;font-size:1.3rem;letter-spacing:-.02em;margin:16px 0 0}
.cheat{display:flex;flex-direction:column;gap:6px}
.cheat h3{font-family:var(--f-disp);font-weight:500;font-size:1rem;margin:14px 0 2px;color:var(--ink-2)}
.ch{display:grid;grid-template-columns:3.4rem 1fr;gap:8px;align-items:baseline;line-height:1.4}
.ch .k{font-family:var(--f-mono);font-size:.72rem;color:var(--ink-3)}
.ch span:last-child{background:linear-gradient(transparent 60%,var(--mark) 60%);background-size:100% 100%;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.opt{display:flex;gap:8px;align-items:center;font-family:var(--f-mono);font-size:.75rem;color:var(--ink-2)}
.testlink{font-family:var(--f-mono);font-size:.75rem;color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--line)}
.testlink:hover{color:var(--ink)}
@media (max-width:480px){body{font-size:16px}.seg button{padding:6px 10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header>
  <div class="wrap">
    <div class="hd">
      <div class="brand">TZS <mark>lidsky</mark></div>
      <a class="testlink" href="./">Test 30 otázek →</a>
      <div class="seg voice" role="group" aria-label="Jazyk">
        <button id="v-l" aria-pressed="true">Lidsky</button>
        <button id="v-u" aria-pressed="false">Úředně</button>
      </div>
    </div>
    <nav class="modes" aria-label="Režim">
      <button data-m="learn" aria-pressed="true">Procvičit</button>
      <button data-m="topics" aria-pressed="false">Témata</button>
      <button data-m="cheat" aria-pressed="false">Tahák</button>
      <button data-m="browse" aria-pressed="false">Projít vše</button>
    </nav>
    <div class="filters" id="filters" aria-label="Okruhy"></div>
  </div>
  <div class="bar" aria-hidden="true"><i id="bar"></i></div>
</header>

<div class="wrap"><main id="main"></main></div>

<script src="lidsky-data.js"></script>
<script>
const DATA=window.TZS_LIDSKY;
try{const th=localStorage.getItem("tzs-theme");if(th)document.documentElement.setAttribute("data-theme",th)}catch(e){}
const Q=DATA.q, OK=DATA.okruhy, T=DATA.temata;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const byK={};Q.forEach(q=>byK[q.k]=q);
let store={};
try{store=JSON.parse(localStorage.getItem('tzs-lidsky')||'{}')}catch(e){}
const S=Object.assign({voice:'l',mode:'learn',okruh:'*',tema:null,tf:true,hist:{}},store);
function save(){try{localStorage.setItem('tzs-lidsky',JSON.stringify({voice:S.voice,okruh:S.okruh,tema:S.tema,tf:S.tf,mode:S.mode,hist:S.hist}))}catch(e){}}

const isBad=k=>S.hist[k]&&S.hist[k].last===0;
const isOk=k=>S.hist[k]&&S.hist[k].last===1;
function pool(){
  if(S.tema!==null&&S.mode==='learn') return T[S.tema].k.map(k=>byK[k]);
  return Q.filter(q=>S.okruh==='*'||(S.okruh==='!'?isBad(q.k):q.o===S.okruh));
}
function okName(k){return OK[k].split(',')[0].replace(/\s*\(.*$/,'')}

function renderFilters(){
  const wrong=Q.filter(q=>isBad(q.k)).length;
  const items=[['*','Vše · '+Q.length],['!','K opakování · '+wrong],...Object.keys(OK).map(k=>[k,k+' · '+okName(k)])];
  $('#filters').innerHTML=items.map(([k,t])=>`<button class="chip" data-k="${k}" aria-pressed="${S.okruh===k}" title="${esc(OK[k]||'')}">${esc(t)}</button>`).join('');
}
$('#filters').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;S.okruh=b.dataset.k;S.tema=null;save();cur=null;render()});
function updateBar(){
  const p=pool(); const done=p.filter(q=>isOk(q.k)).length;
  $('#bar').style.width=(p.length?done/p.length*100:0)+'%';
}

/* ---------- procvičování ---------- */
let cur=null, order=null, answered=null, tfShow=null, tfAns=null;
function pick(){
  const p=pool(); if(!p.length) return null;
  const w=p.map(q=>{const h=S.hist[q.k];return !h?3:(h.last===0?5:1)});
  let r=Math.random()*w.reduce((a,b)=>a+b,0);
  for(let i=0;i<p.length;i++){r-=w[i];if(r<=0){ if(cur&&p[i].k===cur.k&&p.length>1) continue; return p[i]}}
  return p[p.length-1];
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const useTF=q=>S.tf&&q.tp;

function renderLearn(){
  if(!cur){cur=pick();order=shuffle([0,1,2]);answered=null;tfAns=null;tfShow=cur&&Math.random()<.5?'p':'n'}
  const m=$('#main');
  let html='';
  if(S.tema!==null){const t=T[S.tema];html+=`<div class="banner"><span>Téma: <b>${esc(t.n)}</b> · ${t.k.length} otázek</span><button id="untema">Zpět na celý okruh</button></div>`}
  if(!cur){m.innerHTML=html+`<p class="empty">${S.okruh==='!'?'Žádná otázka teď nečeká na opakování. Dobrá práce.':'Tady zatím nic není.'}</p>`;return}
  const L=S.voice==='l', q=cur, h=S.hist[q.k], t=T[q.tm];
  html+=`<div class="meta"><b>${q.k}</b><span class="okn">${esc(okName(q.o))} · ${esc(t.n)}</span>${h?`<span>· ${h.ok+h.bad}× (${h.ok} dobře)</span>`:''}</div>`;
  const tf=useTF(q);
  if(tf){
    const st=tfShow==='p'?q.tp:q.tn;
    html+=`<p class="step">Pravda, nebo ne?</p><p class="stmt">${esc(st)}</p>`;
    if(tfAns===null){
      html+=`<div class="tf"><button class="ans" data-tf="p"><span>1 · Pravda</span></button><button class="ans" data-tf="n"><span>2 · Nepravda</span></button></div><p class="keys">Klávesy 1 / 2</p>`;
      m.innerHTML=html+statsHtml()+optHtml();return;
    }
    const tfOk=tfAns===tfShow;
    html+=`<p class="tfres ${tfOk?'ok':'bad'}">${tfOk?'Ano, správně.':'Kdepak.'} Tvrzení je ${tfShow==='p'?'pravdivé':'nepravdivé'}.${tfShow==='n'?' Pravdivě zní: <b>'+esc(q.tp)+'</b>':''}</p>
    <p class="step">${tfShow==='n'?'Teď to oprav: která odpověď na původní otázku platí?':'Teď přesně: která odpověď na původní otázku platí?'}</p>`;
  }
  html+=`<h1 class="q ${L?'':'uredne'}">${esc(L?q.ql:q.q)}</h1><div class="answers">`;
  const at=L?q.al:q.a;
  order.forEach((i,pos)=>{
    let cls='';
    if(answered!==null){cls=i===0?'ok':(i===answered?'bad':'dim')}
    html+=`<button class="ans ${cls}" data-i="${i}" ${answered!==null?'disabled':''}><span class="n">${pos+1}</span><span>${esc(at[i])}${answered!==null&&L?`<small>${esc(q.a[i])}</small>`:''}</span></button>`;
  });
  html+='</div>';
  if(answered!==null){
    const good=answered===0&&(!tf||tfAns===tfShow);
    html+=`<section class="fb" aria-live="polite">
      <div class="verdict ${good?'ok':'bad'}">${good?'Správně.':(answered===0?'Odpověď sedí, ale pravda/nepravda ne.':'Vedle.')}</div>
      <p class="why">${esc(q.p)}</p>
      ${q.h?`<p class="hook"><span>${esc(q.h)}</span></p>`:''}
      <div class="src">${esc(q.s)}</div>
      <details><summary>Souvislosti: ${esc(t.n)}</summary><ul class="facts" style="margin-top:.6em">${t.b.map(b=>`<li>${esc(b)}</li>`).join('')}</ul>
        ${S.tema===null?`<p style="margin:.6em 0 0"><button class="lnk" data-tema="${q.tm}">Procvičit celé téma (${t.k.length})</button></p>`:''}</details>
      <details ${L?'':'open'}><summary>${L?'Úřední znění':'Lidské znění'}</summary>
        <p class="orig"><em>${esc(L?q.q:q.ql)}</em><br>→ ${esc(L?q.a[0]:q.al[0])}</p></details>
    </section>
    <div class="row"><button class="btn" id="next">Další otázka</button></div>
    <p class="keys">Enter = další</p>`;
  }else html+=`<p class="keys">Klávesy 1–3 vyberou odpověď</p>`;
  m.innerHTML=html+statsHtml()+optHtml();
}
function statsHtml(){
  const seen=Q.filter(x=>S.hist[x.k]).length, okN=Q.filter(x=>isOk(x.k)).length;
  return `<div class="stats"><div class="st"><b>${seen}</b><span>z ${Q.length} viděno</span></div><div class="st"><b>${okN}</b><span>naposled dobře</span></div><div class="st"><b>${seen-okN}</b><span>k opakování</span></div></div>`;
}
function optHtml(){return `<label class="opt"><input type="checkbox" id="tfopt" ${S.tf?'checked':''}> Ano/ne otázky jako pravda/nepravda s opravou</label>`}
function answerTF(v){if(tfAns!==null||!cur)return;tfAns=v;renderLearn()}
function answer(i){
  if(answered!==null||!cur)return;
  if(useTF(cur)&&tfAns===null)return;
  answered=i;
  const good=i===0&&(!useTF(cur)||tfAns===tfShow);
  const h=S.hist[cur.k]||{ok:0,bad:0,last:null};
  if(good){h.ok++;h.last=1}else{h.bad++;h.last=0}
  S.hist[cur.k]=h;save();renderFilters();updateBar();renderLearn();
  const n=$('#next');n&&n.focus({preventScroll:true});
}
function next(){cur=null;render();window.scrollTo({top:0})}

/* ---------- témata ---------- */
function themesFiltered(){
  return T.map((t,i)=>[t,i]).filter(([t])=>S.okruh==='*'||(S.okruh==='!'?t.k.some(isBad):t.o===S.okruh));
}
function renderTopics(){
  const list=themesFiltered(); let html='', last=null;
  if(!list.length){$('#main').innerHTML='<p class="empty">Žádné téma teď nemá otázky k opakování.</p>';return}
  html+=`<p class="fine meta">${list.length} témat. Přečti si body, pak téma procvič. Otázky jsou seskupené podle souvislostí, ne podle pořadí v zadání.</p><div class="topics">`;
  for(const [t,i] of list){
    if(t.o!==last){html+=`<h2 class="okh">${t.o} · ${esc(okName(t.o))}</h2>`;last=t.o}
    const okN=t.k.filter(isOk).length, bad=t.k.filter(isBad).length;
    html+=`<article class="tp"><h2>${esc(t.n)}</h2><p class="s">${esc(t.s)}</p>
      <ul class="facts">${t.b.map(b=>`<li>${esc(b)}</li>`).join('')}</ul>
      <div class="pr"><i><b style="width:${okN/t.k.length*100}%"></b></i><span>${okN}/${t.k.length} dobře${bad?` · ${bad} k opakování`:''}</span></div>
      <div class="row"><button class="btn" data-tema="${i}">Procvičit téma</button></div></article>`;
  }
  $('#main').innerHTML=html+'</div>';
}

/* ---------- tahák ---------- */
function renderCheat(){
  const list=themesFiltered(); let html='<p class="fine meta">Všechny pomůcky na jednom místě, seřazené podle témat. Na rychlé opakování před zkouškou.</p><div class="cheat">', last=null;
  for(const [t] of list){
    if(t.o!==last){html+=`<h2 class="okh">${t.o} · ${esc(okName(t.o))}</h2>`;last=t.o}
    const items=t.k.map(k=>byK[k]).filter(q=>q.h&&(S.okruh!=='!'||isBad(q.k)));
    if(!items.length)continue;
    html+=`<h3>${esc(t.n)}</h3>`+items.map(q=>`<div class="ch"><span class="k">${q.k}</span><span>${esc(q.h)}</span></div>`).join('');
  }
  $('#main').innerHTML=html+'</div>';
}

/* ---------- procházení ---------- */
let bq='', limit=40;
function renderBrowse(){
  const L=S.voice==='l', t=bq.trim().toLowerCase();
  let p=pool(); if(t) p=p.filter(q=>(q.k+' '+q.q+' '+q.ql+' '+q.a[0]+' '+q.al[0]+' '+q.s+' '+q.h).toLowerCase().includes(t));
  $('#main').innerHTML=`<input class="search" id="bs" type="search" placeholder="Hledat v otázkách, odpovědích, paragrafech…" value="${esc(bq)}" aria-label="Hledat">
  <div class="meta">${p.length} otázek · správná odpověď zvýrazněná</div>
  <div class="list">${p.slice(0,limit).map(q=>`<article class="it"><span class="k">${q.k} · ${esc(q.s)}</span>
    <div class="iq">${esc(L?q.ql:q.q)}</div>
    <p class="ia"><mark>${esc(L?q.al[0]:q.a[0])}</mark></p>
    ${q.h?`<p class="io">Pomůcka: ${esc(q.h)}</p>`:''}
    <p class="io">${L?'Úředně: '+esc(q.a[0]):'Lidsky: '+esc(q.al[0])}</p></article>`).join('')}</div>
  ${p.length>limit?`<button class="btn ghost more" id="more">Načíst dalších ${Math.min(40,p.length-limit)}</button>`:''}`;
  const s=$('#bs'); s.addEventListener('input',()=>{bq=s.value;limit=40;renderBrowse();const n=$('#bs');n.focus();n.setSelectionRange(n.value.length,n.value.length)});
  const mo=$('#more'); mo&&mo.addEventListener('click',()=>{limit+=40;renderBrowse()});
}

function render(){
  document.querySelectorAll('.modes button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===S.mode));
  document.querySelectorAll('#v-l,#v-u').forEach(b=>b.setAttribute('aria-pressed',(b.id==='v-l')===(S.voice==='l')));
  renderFilters();updateBar();
  ({learn:renderLearn,topics:renderTopics,cheat:renderCheat,browse:renderBrowse})[S.mode]();
}
document.querySelector('.modes').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.mode=b.dataset.m;if(S.mode!=='learn')S.tema=null;cur=null;save();render();window.scrollTo({top:0})});
$('#v-l').onclick=()=>{S.voice='l';save();render()};
$('#v-u').onclick=()=>{S.voice='u';save();render()};
$('#main').addEventListener('click',e=>{
  const tm=e.target.closest('[data-tema]'); if(tm){S.tema=+tm.dataset.tema;S.mode='learn';cur=null;save();render();window.scrollTo({top:0});return}
  if(e.target.id==='untema'){S.tema=null;cur=null;save();render();return}
  const f=e.target.closest('[data-tf]'); if(f) return answerTF(f.dataset.tf);
  const a=e.target.closest('.ans'); if(a&&!a.disabled&&a.dataset.i!==undefined) return answer(+a.dataset.i);
  if(e.target.id==='next') next();
});
$('#main').addEventListener('change',e=>{if(e.target.id==='tfopt'){S.tf=e.target.checked;save();if(answered===null){tfAns=null;renderLearn()}}});
document.addEventListener('keydown',e=>{
  if(S.mode!=='learn'||e.target.tagName==='INPUT'||!cur)return;
  if(useTF(cur)&&tfAns===null){if(e.key==='1')answerTF('p');else if(e.key==='2')answerTF('n');return}
  if(answered===null&&['1','2','3'].includes(e.key)) answer(order[+e.key-1]);
  else if(answered!==null&&(e.key==='Enter'||e.key===' ')){e.preventDefault();next()}
});
if(S.tema!==null&&!T[S.tema])S.tema=null;
render();

</script>
</body>
</html>
