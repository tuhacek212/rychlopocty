<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Příprava na ústní část zkoušky odborné způsobilosti ČKAIT – odborná rozprava nad předloženou dokumentací, obor technologická zařízení staveb.">
<title>Rozprava ČKAIT TZS</title>
<style>html{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#FFFFFF; --bg-2:#F7F7F8; --ink:#0A0A0B; --ink-2:#43464B; --ink-3:#83868C;
  --line:#DEDFE3; --line-2:#B9BCC2;
  --ok:#066E4A; --ok-bg:#E9F5F0; --bad:#C62A1E; --bad-bg:#FCECEA; --accent:#1433FF;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#08090A; --bg-2:#111315; --ink:#F5F6F7; --ink-2:#A8ACB2; --ink-3:#6B6F75;
    --line:#202327; --line-2:#383C42;
    --ok:#4FC38D; --ok-bg:#10231B; --bad:#FF7A6B; --bad-bg:#2A1512; --accent:#8CA0FF;
  }
}
:root[data-theme="dark"]{
  --bg:#08090A; --bg-2:#111315; --ink:#F5F6F7; --ink-2:#A8ACB2; --ink-3:#6B6F75;
  --line:#202327; --line-2:#383C42;
  --ok:#4FC38D; --ok-bg:#10231B; --bad:#FF7A6B; --bad-bg:#2A1512; --accent:#8CA0FF;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:Archivo,system-ui,-apple-system,sans-serif;
  font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;
}
.sheet{max-width:58rem;margin:0 auto;padding:28px 20px 80px}
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:10px}
h1{font-weight:700;font-size:clamp(1.5rem,4.5vw,2rem);letter-spacing:-.035em;line-height:1;margin:0}
.sub{font-family:"DM Mono",monospace;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:0 0 0 auto}
.intro{font-size:.9rem;color:var(--ink-2);margin:12px 0 0;max-width:72ch}
.back{font-family:"DM Mono",monospace;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--line-2)}
.back:hover{color:var(--ink);border-bottom-color:var(--ink)}

/* ---- ovládání ---- */
.tools{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding:12px 0;margin-top:18px}
.pbtn{
  font-family:"DM Mono",monospace;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;
  background:none;border:0;border-bottom:1px solid var(--line-2);color:var(--ink);
  padding:6px 0;cursor:pointer;
}
.pbtn:hover{border-bottom-color:var(--ink)}
.pbtn.on{color:var(--accent);border-bottom-color:var(--accent)}
.progress{margin-left:auto;font-family:"DM Mono",monospace;font-size:.75rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.progress b{color:var(--ok);font-weight:500}

/* ---- bloky ---- */
h2{
  font-family:"DM Mono",monospace;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink);margin:34px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line-2);
  display:flex;justify-content:space-between;gap:8px;
}
h2 b{color:var(--ink-3);font-weight:400}
ul.facts{list-style:none;margin:0;padding:0}
ul.facts li{font-size:.88rem;line-height:1.45;padding:5px 0;border-bottom:1px solid var(--line)}
ul.facts li:last-child{border-bottom:0}
ul.facts li>b{font-weight:600}
ul.facts li>span{color:var(--ink-2)}
.n{font-family:"DM Mono",monospace;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.pitch{font-size:.95rem;line-height:1.6;border-left:3px solid var(--ink);padding:4px 0 4px 16px;margin:6px 0 0;max-width:72ch}

/* ---- otázky ---- */
details.qa{border-bottom:1px solid var(--line)}
details.qa>summary{
  list-style:none;cursor:pointer;display:grid;grid-template-columns:2.2rem 1fr auto;gap:10px;
  align-items:baseline;padding:13px 0;
}
details.qa>summary::-webkit-details-marker{display:none}
.qn{font-family:"DM Mono",monospace;font-size:.75rem;color:var(--ink-3);font-variant-numeric:tabular-nums}
.qt{font-weight:600;font-size:1rem;line-height:1.35;letter-spacing:-.015em}
details.qa>summary:hover .qt{color:var(--accent)}
details[open].qa>summary .qt{color:var(--ink)}
.known{display:inline-flex;align-items:center;gap:6px;font-family:"DM Mono",monospace;font-size:.66rem;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);cursor:pointer;white-space:nowrap}
.known input{accent-color:var(--ok);width:15px;height:15px;margin:0}
details.qa.done .qt{color:var(--ink-3)}
details.qa.done .known{color:var(--ok)}
.ans{padding:0 0 18px 3.2rem;display:flex;flex-direction:column;gap:10px;max-width:76ch}
.ans p{margin:0}
.lbl{font-family:"DM Mono",monospace;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:2px}
.say{font-size:.95rem;line-height:1.6}
.say ul{margin:4px 0 0;padding-left:1.1rem}
.say li{margin:2px 0}
.calc{
  font-family:"DM Mono",monospace;font-size:.8rem;line-height:1.6;white-space:pre-wrap;margin:0;
  background:var(--bg-2);border-left:3px solid var(--line-2);padding:10px 12px;overflow-x:auto;color:var(--ink)
}
.no{font-size:.86rem;background:var(--bad-bg);border-left:3px solid var(--bad);padding:8px 12px}
.no b{color:var(--bad)}
.yes{font-size:.86rem;background:var(--ok-bg);border-left:3px solid var(--ok);padding:8px 12px}
.yes b{color:var(--ok)}
.src{font-size:.78rem;color:var(--ink-3)}
.check{font-size:.82rem;color:var(--ink-2);border-left:3px solid var(--accent);padding:6px 12px}
.check b{color:var(--accent);font-weight:600}
.hl{animation:hl 1.6s ease}
@keyframes hl{0%{background:var(--bg-2)}100%{background:transparent}}

/* ---- říkej / neříkej ---- */
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--line)}
.pairs div{font-size:.86rem;padding:8px 10px 8px 0;border-bottom:1px solid var(--line)}
.pairs .h{font-family:"DM Mono",monospace;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase}
.pairs .h.n1{color:var(--bad)} .pairs .h.y1{color:var(--ok)}
.pairs .n2{color:var(--ink-2);text-decoration:line-through;text-decoration-color:var(--bad)}

.foot{margin-top:28px;border-top:1px solid var(--line);padding-top:8px;font-size:.76rem;color:var(--ink-3);max-width:72ch}

@media (max-width:560px){
  .sheet{padding:20px 16px 72px}
  .ans{padding-left:0}
  details.qa>summary{grid-template-columns:1.8rem 1fr;}
  .known{grid-column:2}
  .pairs{grid-template-columns:1fr}
  .pairs .h.y1{display:none}
  .progress{margin-left:0;width:100%}
}
@media print{
  @page{size:A4;margin:12mm}
  html,body{background:#fff;color:#000}
  :root{--bg:#fff;--bg-2:#f3f3f3;--ink:#000;--ink-2:#222;--ink-3:#555;--line:#ccc;--line-2:#888;--ok:#046046;--bad:#A81E14;--ok-bg:#fff;--bad-bg:#fff}
  .sheet{max-width:none;padding:0}
  body{font-size:9pt}
  .tools,.known,.back{display:none!important}
  details.qa{break-inside:avoid}
  .ans{padding-left:0}
  .say{font-size:9pt}.calc{font-size:8pt}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.lock{min-height:80vh;display:grid;place-items:center;padding:24px 16px}
.lock form{width:min(100%,22rem);display:flex;flex-direction:column;gap:14px}
.lock h1{font-size:1.6rem}
.lock p{margin:0;color:var(--ink-2);font-size:.9rem}
.lock input[type=password]{font:inherit;font-size:1rem;padding:11px 12px;border:1px solid var(--line-2);border-radius:0;background:var(--bg);color:var(--ink);width:100%}
.lock input[type=password]:focus{outline:2px solid var(--accent);outline-offset:1px}
.lock label{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--ink-2)}
.lock button{font-family:"DM Mono",monospace;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;
  padding:13px 0;background:var(--ink);color:var(--bg);border:0;cursor:pointer}
.lock .err{color:var(--bad);font-size:.85rem;min-height:1.2em}
</style>

<div class="lock" id="lock">
  <form id="unlock" autocomplete="off">
    <h1>Rozprava u komise</h1>
    <p>Obsah je zašifrovaný. Zadej heslo.</p>
    <input type="password" id="pw" aria-label="Heslo" autofocus>
    <label><input type="checkbox" id="remember" checked> Zapamatovat na tomto zařízení</label>
    <button type="submit">Odemknout</button>
    <p class="err" id="err" role="alert"></p>
    <p><a class="back" href="./">← zpět na test</a></p>
  </form>
</div>
<div id="secret"></div>

const RKEY = "tzs-rozprava-heslo";
const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b(PAYLOAD.s), iterations:PAYLOAD.n, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b(PAYLOAD.i)}, key, b(PAYLOAD.c));
  return new TextDecoder().decode(pt);
}
async function unlockWith(pw, remember){
  const html = await decrypt(pw);
  document.getElementById("lock").remove();
  document.getElementById("secret").outerHTML = html;
  if (remember) { try { localStorage.setItem(RKEY, pw); } catch(e){} }
  initPage();
}
document.getElementById("unlock").addEventListener("submit", async e => {
  e.preventDefault();
  const err = document.getElementById("err");
  err.textContent = "Ověřuji…";
  try { await unlockWith(document.getElementById("pw").value, document.getElementById("remember").checked); }
  catch(x){ err.textContent = "Špatné heslo."; }
});
(async () => {
  let saved = null; try { saved = localStorage.getItem(RKEY); } catch(e){}
  if (saved) { try { await unlockWith(saved, true); } catch(x){ try { localStorage.removeItem(RKEY); } catch(e){} } }
})();
function initPage(){

const root=document.documentElement;
function applyTheme(t){ if(t) root.setAttribute("data-theme",t); else root.removeAttribute("data-theme"); }
let st=null; try{ st=localStorage.getItem("tzs-theme"); }catch(e){}
applyTheme(st);
document.getElementById("theme").onclick=()=>{
  const dark=root.getAttribute("data-theme")==="dark"
    || (!root.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
  const n=dark?"light":"dark"; applyTheme(n);
  try{ localStorage.setItem("tzs-theme",n); }catch(e){}
};

const KEY="tzs-rozprava-umim";
const cards=[...document.querySelectorAll("details.qa")];
let known={}; try{ known=JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){ known={}; }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(known)); }catch(e){} }
let onlyTodo=false;
function paint(){
  let n=0;
  cards.forEach(c=>{
    const k=!!known[c.id]; if(k) n++;
    c.classList.toggle("done",k);
    c.querySelector(".known input").checked=k;
    c.hidden = onlyTodo && k;
  });
  document.getElementById("progress").innerHTML=`umím <b>${n}</b> / ${cards.length}`;
}
cards.forEach(c=>{
  const box=c.querySelector(".known input");
  box.addEventListener("change",()=>{ known[c.id]=box.checked; if(!box.checked) delete known[c.id]; save(); paint(); });
});
document.getElementById("open-all").onclick=()=>cards.forEach(c=>c.open=true);
document.getElementById("close-all").onclick=()=>cards.forEach(c=>c.open=false);
document.getElementById("only-todo").onclick=e=>{ onlyTodo=!onlyTodo; e.currentTarget.classList.toggle("on",onlyTodo); paint(); };
document.getElementById("reset").onclick=()=>{ if(confirm("Vynulovat všechna „umím“?")){ known={}; save(); paint(); } };
document.getElementById("random").onclick=()=>{
  const pool=cards.filter(c=>!known[c.id]); const list=pool.length?pool:cards;
  cards.forEach(c=>c.open=false);
  const c=list[Math.random()*list.length|0];
  c.hidden=false;
  const y=c.getBoundingClientRect().top+scrollY-document.getElementById("tools").offsetHeight-8;
  scrollTo({top:y,behavior:"smooth"});
  c.classList.remove("hl"); void c.offsetWidth; c.classList.add("hl");
};
window.addEventListener("beforeprint",()=>cards.forEach(c=>{c.dataset.wasOpen=c.open; c.open=true;}));
window.addEventListener("afterprint",()=>cards.forEach(c=>{c.open=c.dataset.wasOpen==="true";}));
paint();

}
</script>

</body>
